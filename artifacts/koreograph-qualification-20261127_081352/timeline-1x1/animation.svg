<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="Repères temporels" font-family="system-ui"><title>Repères temporels</title><desc>Projection dérivée privée. Les relations affichées ne constituent pas une preuve ou une autorisation de publication.</desc><rect width="1080" height="1080" fill="#0C1918"/><rect x="42" y="35" width="8" height="38" rx="3" fill="#1E6864"/><text x="64" y="65" font-size="23" fill="#E2F2EF" text-anchor="start">KOREOGRAPH · Repères temporels</text><text x="55" y="105" font-size="18" fill="#A6C9C3" text-anchor="start">Vue dérivée · aucune autorisation de publication</text><g opacity="1"><animate attributeName="opacity" values="1;0;0" keyTimes="0.000000000;0.609756098;1.000000000" dur="14760ms" repeatCount="1" fill="freeze" calcMode="discrete"/><text x="55" y="174" font-size="32" fill="#E2F2EF" text-anchor="start">Repères ordonnés</text><g opacity="1"><title>Premier dessin année fictive · 2000</title><rect x="151" y="438.4" width="238" height="160" rx="15" fill="#0C1918" stroke="#78C5BC" stroke-width="2"/><circle cx="171" cy="458.4" r="6" fill="#1E6864" stroke="#78C5BC"/><text x="270" y="476.4" font-size="23" fill="#E2F2EF" text-anchor="middle">Premier</text><text x="270" y="507.4" font-size="23" fill="#E2F2EF" text-anchor="middle">dessin</text><text x="270" y="540.4" font-size="19" fill="#A6C9C3" text-anchor="middle">année fictive</text><text x="270" y="567.4" font-size="19" fill="#A6C9C3" text-anchor="middle">· 2000</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.000000000;0.028455285;0.045392954;1.000000000" dur="14760ms" repeatCount="1" fill="freeze"/><title>Prototype année fictive · 2005</title><rect x="421" y="438.4" width="238" height="160" rx="15" fill="#0C1918" stroke="#78C5BC" stroke-width="2"/><circle cx="441" cy="458.4" r="6" fill="#1E6864" stroke="#78C5BC"/><text x="540" y="476.4" font-size="23" fill="#E2F2EF" text-anchor="middle">