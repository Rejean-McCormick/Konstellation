<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-label="Repères temporels" font-family="system-ui"><title>Repères temporels</title><desc>Projection dérivée privée. Les relations affichées ne constituent pas une preuve ou une autorisation de publication.</desc><rect width="900" height="1600" fill="#0C1918"/><rect x="42" y="35" width="8" height="38" rx="3" fill="#1E6864"/><text x="64" y="65" font-size="23" fill="#E2F2EF" text-anchor="start">KOREOGRAPH · Repères temporels</text><text x="55" y="105" font-size="18" fill="#A6C9C3" text-anchor="start">Vue dérivée · aucune autorisation de publication</text><g opacity="1"><animate attributeName="opacity" values="1;0;0" keyTimes="0.000000000;0.609756098;1.000000000" dur="14760ms" repeatCount="1" fill="freeze" calcMode="discrete"/><text x="55" y="174" font-size="32" fill="#E2F2EF" text-anchor="start">Repères ordonnés</text><g opacity="1"><title>Premier dessin année fictive · 2000</title><rect x="270" y="445" width="360" height="160" rx="15" fill="#0C1918" stroke="#78C5BC" stroke-width="2"/><circle cx="290" cy="465" r="6" fill="#1E6864" stroke="#78C5BC"/><text x="450" y="483" font-size="23" fill="#E2F2EF" text-anchor="middle">Premier dessin</text><text x="450" y="547" font-size="19" fill="#A6C9C3" text-anchor="middle">année fictive · 2000</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.000000000;0.028455285;0.045392954;1.000000000" dur="14760ms" repeatCount="1" fill="freeze"/><title>Prototype année fictive · 2005</title><rect x="270" y="640" width="360" height="160" rx="15" fill="#0C1918" stroke="#78C5BC" stroke-width="2"/><circle cx="290" cy="660" r="6" fill="#1E6864" stroke="#78C5BC"/><text x="450" y="678" font-size="23" fill="#E2F2EF" text-anchor="middle">Prototype</text><text x="450" y="742" font-size="19" fill="#A6C9C3" text-anchor="middle">année fictive · 2005</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.000000000;0.056910569;0.073848238;1.000000000" dur="14760ms" repeatCount="1" fill="freeze"/><title>Version finale année fictive · 2012</title><rect x="270" y="835" width="360" height="160" rx="15" fill="#0C1918" stroke="#78C5BC" stroke-width="2"/><circle cx="290" cy="855" r="6" fill="#1E6864" stroke="#78C5BC"/><text x="450" y="873" font-size="23" fill="#E2F2EF" text-anchor="middle">Version finale</text><text x="450" y="937" font-size="19" fill="#A6C9C3" text-anchor="middle">année fictive · 2012</text></g><text x="55" y="1535" font-size="18" fill="#A6C9C3" text-anchor="start">Ordre de début connu ; espacements non proportionnels</text><text x="55" y="1561" font-size="18" fill="#A6C9C3" text-anchor="start">au temps.</text><text x="845" y="115" font-size="20" fill="#A6C9C3" text-anchor="end">1 / 2</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.000000000;0.609756098;1.000000000" dur="14760ms" repeatCount="1" fill="freeze" calcMode="discrete"/><text x="55" y="174" font-size="32" fill="#E2F2EF" text-anchor="start">Repères ordonnés</text><g opacity="1"><title>Révision année fictive · 2018</title><rect x="270" y="640" width="360" height="160" rx="15" fill="#0C1918" stroke="#78C5BC" stroke-width="2"/><circle cx="290" cy="660" r="6" fill="#1E6864" stroke="#78C5BC"/><text x="450" y="678" font-size="23" fill="#E2F2EF" text-anchor="middle">Révision</text><text x="450" y="742" font-size="19" fill="#A6C9C3" text-anchor="middle">année fictive · 2018</text></g><text x="55" y="1535" font-size="18" fill="#A6C9C3" text-anchor="start">Ordre de début connu ; espacements non proportionnels</text><text x="55" y="1561" font-size="18" fill="#A6C9C3" text-anchor="start">au temps.</text><text x="845" y="115" font-size="20" fill="#A6C9C3" text-anchor="end">2 / 2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0" keyTimes="0;1" dur="14760ms" repeatCount="1" fill="freeze"/></g></svg>