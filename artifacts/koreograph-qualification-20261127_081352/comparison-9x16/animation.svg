<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-label="Comparaison de valeurs" font-family="system-ui"><title>Comparaison de valeurs</title><desc>Projection dérivée privée. Les relations affichées ne constituent pas une preuve ou une autorisation de publication.</desc><rect width="900" height="1600" fill="#0C1918"/><rect x="42" y="35" width="8" height="38" rx="3" fill="#1E6864"/><text x="64" y="65" font-size="23" fill="#E2F2EF" text-anchor="start">KOREOGRAPH · Comparaison de valeurs</text><text x="55" y="105" font-size="18" fill="#A6C9C3" text-anchor="start">Vue dérivée · aucune autorisation de publication</text><g opacity="1"><animate attributeName="opacity" values="1;0;0" keyTimes="0.000000000;0.471232877;1.000000000" dur="14600ms" repeatCount="1" fill="freeze" calcMode="discrete"/><text x="55" y="174" font-size="32" fill="#E2F2EF" text-anchor="start">Dimension : Durée</text><g opacity="1"><title>Projet Alpha 12 jours</title><rect x="270" y="445" width="360" height="160" rx="15" fill="#0C1918" stroke="#78C5BC" stroke-width="2"/><circle cx="290" cy="465" r="6" fill="#1E6864" stroke="#78C5BC"/><text x="450" y="483" font-size="23" fill="#E2F2EF" text-anchor="middle">Projet Alpha</text><text x="450" y="547" font-size="19" fill="#A6C9C3" text-anchor="middle">12 jours</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.000000000;0.028767123;0.045890411;1.000000000" dur="14600ms" repeatCount="1" fill="freeze"/><title>Projet Bêta 9 jours</title><rect x="270" y="640" width="360" height="160" rx="15" fill="#0C1918" stroke="#78C5BC" stroke-width="2"/><circle cx="290" cy="660" r="6" fill="#1E6864" stroke="#78C5BC"/><text x="450" y="678" font-size="23" fill="#E2F2EF" text-anchor="middle">Projet Bêta</text><text x="450" y="742" font-size="19" fill="#A6C9C3" text-anchor="middle">9 jours</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.000000000;0.0575