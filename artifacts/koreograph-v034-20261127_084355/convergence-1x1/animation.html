ctor('#time'),starts=[0],d=6600;const media=matchMedia('(prefers-reduced-motion: reduce)');let paused=true;s.pauseAnimations();s.setCurrentTime(0);function stop(){paused=true;s.pauseAnimations();b.textContent='Lire'}function seek(t){let ms=Math.max(0,Math.min(t*1000,d));if(media.matches){const end=starts.find(x=>x>ms)??d;ms=Math.max(0,end-1);}s.setCurrentTime(ms/1000);}b.onclick=()=>{if(!paused)return stop();if(s.getCurrentTime()*1000>=d)seek(0);paused=false;s.unpauseAnimations();b.textContent='Pause'};r.oninput=()=>{stop();seek(Number(r.value)/1000)};document.querySelector('#prev').onclick=()=>{stop();const t=s.getCurrentTime()*1000,i=starts.findLastIndex(x=>x<=t);seek(starts[Math.max(0,i-1)]/1000)};document.querySelector('#next').onclick=()=>{stop();seek((starts.find(x=>x>s.getCurrentTime()*1000+50)??d)/1000)};function preference(){stop();b.disabled=media.matches;if(media.matches)seek(s.getCurrentTime());}media.addEventListener('change',preference);preference();function tick(){const t=Math.min(d,s.getCurrentTime()*1000);r.value=t;o.value=(t/1000).toFixed(1)+' s';if(t>=d&&!paused)stop();requestAnimationFrame(tick)}requestAnimationFrame(tick);})();</script></html>
